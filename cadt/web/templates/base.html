<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>{% block title %}Photos{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
{% set ui = appearance() %}
<body class="{% block body_class %}{% endblock %} theme-{{ ui.theme }} accent-{{ ui.accent }}" style="--cols: {{ ui.cols }}">
{% block content %}{% endblock %}
{% block nav %}
<nav class="tabs" aria-label="Navigation">
  <a href="/" class="{{ 'on' if tab == 'photos' }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Photos</a>
  <a href="/sessions" class="{{ 'on' if tab == 'sessions' }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Sessions</a>
  <a href="/reglages" class="{{ 'on' if tab == 'reglages' }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    Réglages</a>
</nav>
{% endblock %}
<script src="/static/app.js" defer></script>
</body>
</html>
